<?xml version="1.0" encoding="UTF-8"?>
<!-- Proposed header: master rainbow meter full-bleed on top edge (~10px). See index.html .header-meter-band -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 96" width="920" height="96">
  <title>Header mock — full-bleed master meter (proposed)</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="100%" stop-color="#e7d9c6"/>
    </linearGradient>
    <linearGradient id="rainbowTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e35a4f" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8a4dc9" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="rainbowFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e35a4f"/>
      <stop offset="50%" stop-color="#4bc067"/>
      <stop offset="100%" stop-color="#8a4dc9"/>
    </linearGradient>
  </defs>
  <rect width="920" height="96" rx="11" fill="url(#panel)" stroke="#b5a894"/>
  <rect x="0" y="0" width="920" height="10" fill="#120e0a"/>
  <rect x="0" y="0" width="920" height="10" fill="url(#rainbowTrack)"/>
  <rect x="0" y="0" width="620" height="10" fill="url(#rainbowFill)"/>
  <rect x="0" y="9" width="920" height="1" fill="#4c3b2d" opacity="0.85"/>
  <text x="16" y="44" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#222724">Project6581</text>
  <text x="16" y="60" font-family="system-ui,sans-serif" font-size="10" fill="#555149">SID STUDIO · reSIDfp</text>
  <text x="460" y="90" font-size="9" fill="#888" text-anchor="middle">Full-width meter strip; controls unchanged below</text>
</svg>