<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120">
  <title>Keyboard heading — generator LEDs</title>
  <rect width="720" height="120" fill="#e7ddce" stroke="#bba890" stroke-width="2"/>
  <text x="16" y="28" font-size="12" font-weight="700">Keyboard</text>
  <!-- LED pills -->
  <g font-family="system-ui,sans-serif">
    <rect x="100" y="10" width="72" height="28" rx="14" fill="#d6efe8" stroke="#2d7465"/>
    <circle cx="116" cy="24" r="6" fill="#43ed77" stroke="#237b45"/>
    <text x="128" y="28" font-size="9" fill="#16362d">ROOT · 1/8</text>
    <rect x="180" y="10" width="80" height="28" rx="14" fill="#fde8d8" stroke="#c56a2a"/>
    <circle cx="196" cy="24" r="6" fill="#43ed77" stroke="#b94415"/>
    <text x="208" y="28" font-size="9" fill="#4a2208">GAME</text>
    <rect x="270" y="10" width="56" height="28" rx="14" fill="#f0ebe3" stroke="#9b9384"/>
    <circle cx="286" cy="24" r="6" fill="#e5a43b"/>
    <text x="298" y="28" font-size="9">LATCH</text>
    <circle cx="340" cy="24" r="12" fill="#e9e4d8" stroke="#9b9384"/>
    <text x="340" y="28" font-size="11" text-anchor="middle">?</text>
  </g>
  <text x="400" y="28" font-size="9" fill="#666">tap → ARP tab · long-press → help</text>
  <text x="16" y="48" font-size="9" fill="#888" text-decoration="line-through">Touch and hold · layered unison (→ Help)</text>
  <!-- Octave -->
  <rect x="480" y="12" width="28" height="28" rx="4" fill="#eadcca" stroke="#cf8053"/>
  <text x="494" y="30" text-anchor="middle">−</text>
  <text x="530" y="30" font-size="11">C3–C5</text>
  <rect x="580" y="12" width="28" height="28" rx="4" fill="#eadcca" stroke="#cf8053"/>
  <text x="594" y="30" text-anchor="middle">+</text>
  <rect x="640" y="12" width="64" height="28" rx="4" fill="#eadcca" stroke="#cf8053"/>
  <text x="652" y="30" font-size="9">Hide ▲</text>
  <!-- Keys -->
  <g y="56">
    <rect x="16" y="56" width="688" height="56" fill="#f5f0e8"/>
    <rect x="20" y="60" width="40" height="48" fill="#fff" stroke="#ccc"/>
    <rect x="62" y="60" width="28" height="30" fill="#333"/>
    <rect x="66" y="60" width="36" height="48" fill="#fff" stroke="#ccc"/>
    <text x="200" y="88" font-size="9" fill="#2d7768">teal = root arp key</text>
    <rect x="280" y="60" width="36" height="48" fill="#f0a574" stroke="#b94415"/>
    <text x="320" y="88" font-size="9" fill="#9c4a18">orange = game arp</text>
  </g>
</svg>