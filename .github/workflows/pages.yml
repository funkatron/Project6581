name: Deploy SID Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore compiled SID engine
        id: sid-cache
        uses: actions/cache@v4
        with:
          path: dist/residfp.wasm
          key: sid-wasm-emsdk-4.0.15-linux-v1-${{ hashFiles('scripts/build-residfp.sh', 'native/**') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.sid-cache.outputs.cache-hit != 'true'
        with:
          version: '4.0.15'
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-residfp.sh
      - run: test -s dist/residfp.wasm
      - run: node scripts/check-wasm-imports.mjs
      - run: node scripts/smoke-test-sid.mjs
      - run: node scripts/stamp-build.mjs
      - name: Include published PR previews
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin preview-assets >/dev/null 2>&1; then
            git fetch origin preview-assets
            mkdir -p "$RUNNER_TEMP/preview-assets"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/preview-assets"
            for preview in "$RUNNER_TEMP"/preview-assets/pr-*; do
              [ -d "$preview" ] || continue
              cp -R "$preview" "./$(basename "$preview")"
            done
          fi
      - uses: actions/configure-pages@v5
      # Re-runs retain prior attempt artifacts under the same workflow run.
      # Use an attempt-specific name so deploy-pages finds exactly one.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
