name: Deploy SID Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs, as actions/deploy-pages recommends.
  # In one job, deploy-pages listed the run's artifacts about a second after
  # the upload finished and did not see it yet (2026-11-25, run 45650751660).
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore compiled SID engine
        id: sid-cache
        uses: actions/cache@v4
        with:
          path: dist/residfp.wasm
          key: sid-wasm-emsdk-4.0.15-linux-v1-${{ hashFiles('scripts/build-residfp.sh', 'native/**') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.sid-cache.outputs.cache-hit != 'true'
        with:
          version: '4.0.15'
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-residfp.sh
      - run: test -s dist/residfp.wasm
      - run: node scripts/check-wasm-imports.mjs
      - run: node scripts/smoke-test-sid.mjs
      - run: node scripts/stamp-build.mjs
      # Publish only what the page loads (index.html, src/, dist/residfp.wasm)
      # plus assets/, not the whole checkout (tests, scripts, docs, native…).
      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R index.html src dist assets _site/
      - name: Include published PR previews
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin preview-assets >/dev/null 2>&1; then
            git fetch origin preview-assets
            mkdir -p "$RUNNER_TEMP/preview-assets"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/preview-assets"
            for preview in "$RUNNER_TEMP"/preview-assets/pr-*; do
              [ -d "$preview" ] || continue
              cp -R "$preview" "_site/$(basename "$preview")"
            done
          fi
      - uses: actions/configure-pages@v5
      # Re-runs retain prior attempt artifacts under the same workflow run.
      # Use an attempt-specific name so deploy-pages finds exactly one, and
      # pass it to the deploy job: "Re-run failed jobs" re-runs only deploy,
      # under a new attempt number, against this build's artifact.
      - id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      # One retry for a transient artifact or API failure.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
