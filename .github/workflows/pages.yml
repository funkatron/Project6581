name: Deploy SID Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Deploy merged PRs as well as direct pushes to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - run: bash scripts/build-residfp.sh
      - run: test -s dist/residfp.wasm
      - run: node scripts/check-wasm-imports.mjs
      - run: node scripts/smoke-test-sid.mjs
      - run: node scripts/stamp-build.mjs
      - name: Include published PR previews
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin preview-assets >/dev/null 2>&1; then
            git fetch origin preview-assets
            mkdir -p "$RUNNER_TEMP/preview-assets"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/preview-assets"
            for preview in "$RUNNER_TEMP"/preview-assets/pr-*; do
              [ -d "$preview" ] || continue
              cp -R "$preview" "./$(basename "$preview")"
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
