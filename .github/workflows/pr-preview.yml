name: Build PR preview
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      operation:
        description: 'Publish or remove the preview'
        required: true
        type: choice
        options:
          - publish
          - remove
permissions:
  contents: write
  actions: write
concurrency:
  group: preview-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate requested PR and check out its source
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          head_repo=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepository --jq '.headRepository.nameWithOwner')
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Fork previews are not supported'; exit 1; }
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          git fetch origin "$head_sha"
          git checkout --detach "$head_sha"
      - name: Restore compiled SID engine
        if: inputs.operation == 'publish'
        id: sid-cache
        uses: actions/cache@v4
        with:
          path: dist/residfp.wasm
          key: sid-wasm-emsdk-4.0.15-linux-v1-${{ hashFiles('scripts/build-residfp.sh', 'native/**') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: inputs.operation == 'publish' && steps.sid-cache.outputs.cache-hit != 'true'
        with:
          version: '4.0.15'
      - name: Install SID build dependencies
        if: inputs.operation == 'publish' && steps.sid-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - name: Build and test authentic SID
        if: inputs.operation == 'publish'
        run: |
          npm test
          if [ '${{ steps.sid-cache.outputs.cache-hit }}' != 'true' ]; then bash scripts/build-residfp.sh; fi
          test -s dist/residfp.wasm
          node scripts/check-wasm-imports.mjs
          node scripts/smoke-test-sid.mjs
          node scripts/stamp-build.mjs
      - name: Stage preview content
        if: inputs.operation == 'publish'
        run: |
          mkdir -p "$RUNNER_TEMP/pr-content"
          cp index.html "$RUNNER_TEMP/pr-content/"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "pr-content" / "index.html"
          s = p.read_text()
          s = s.replace("<h1>Project6581</h1>", "<h1>Project6581 · PR #${{ inputs.pr_number }} preview</h1>", 1)
          p.write_text(s)
          PY
          cp -R src dist "$RUNNER_TEMP/pr-content/"
          printf '%s\n' 'PR #${{ inputs.pr_number }} preview' > "$RUNNER_TEMP/pr-content/PREVIEW.txt"
      - name: Publish preview to preview-assets branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_ACTION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$RUNNER_TEMP/preview-assets"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin preview-assets >/dev/null 2>&1; then
            git fetch origin preview-assets
            git worktree add -B preview-assets "$RUNNER_TEMP/preview-assets" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/preview-assets"
            cd "$RUNNER_TEMP/preview-assets"
            git checkout --orphan preview-assets
            git rm -rf . || true
            git clean -fdx
            touch .nojekyll
          fi
          cd "$RUNNER_TEMP/preview-assets"
          if [ "$PR_ACTION" = remove ]; then
            git rm -r -f "pr-${PR_NUMBER}" 2>/dev/null || true
          else
            rm -rf "pr-${PR_NUMBER}"
            mkdir -p "pr-${PR_NUMBER}"
            cp -R "$RUNNER_TEMP/pr-content/." "pr-${PR_NUMBER}/"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: update preview for PR #${PR_NUMBER} (${PR_ACTION})"
            git push origin preview-assets
          fi
      - name: Request Pages rebuild with updated previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
