name: SID Lab native 6510 capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/sid-lab-capture/**'
      - 'scripts/build-sid-lab-capture.sh'
      - 'scripts/sid-lab-process-backend.mjs'
      - 'src/features/sid-instrument-lab/**'
      - 'test/sid-instrument-lab-native-capture.test.js'
      - 'test/fixtures/sid-lab-*.js'
      - '.github/workflows/sid-lab-native.yml'

jobs:
  native-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool g++ make pkg-config libgcrypt20-dev xa65
      - name: Build instrumented libsidplayfp
        run: bash scripts/build-sid-lab-capture.sh
      - name: Verify native binary exists
        run: test -x dist/sid-lab-capture
      - name: Execute actual 6510 fixture and capture SID writes
        run: node --test test/sid-instrument-lab-native-capture.test.js
      - name: Run Instrument Lab tests
        run: node --test test/sid-instrument-lab-*.test.js
