name: Optional browser smoke
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine
        type: choice
        options: [chromium, webkit, both]
        default: both
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness (not part of normal npm test)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ inputs.browser == 'both' && 'chromium webkit' || inputs.browser }}
      - name: Serve application
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/project6581-server.log 2>&1 &
          echo $! > /tmp/project6581-server.pid
      - name: Run browser smoke
        env:
          BROWSER: ${{ inputs.browser }}
        run: node test/browser-smoke.mjs
      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-server-log
          path: /tmp/project6581-server.log
