name: Optional browser smoke
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine
        type: choice
        options: [chromium, webkit, both]
        default: both
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore compiled SID engine
        id: sid-cache
        uses: actions/cache@v4
        with:
          path: dist/residfp.wasm
          key: sid-wasm-emsdk-4.0.15-linux-v1-${{ hashFiles('scripts/build-residfp.sh', 'native/**') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.sid-cache.outputs.cache-hit != 'true'
        with:
          version: '4.0.15'
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - if: steps.sid-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-residfp.sh
      - run: test -s dist/residfp.wasm
      - run: node scripts/check-wasm-imports.mjs
      - run: node scripts/stamp-build.mjs
      - name: Install browser harness (not part of normal npm test)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ inputs.browser == 'both' && 'chromium webkit' || inputs.browser }}
      - name: Serve application
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/project6581-server.log 2>&1 &
          echo $! > /tmp/project6581-server.pid
      - name: Run browser smoke
        env:
          BROWSER: ${{ inputs.browser }}
        run: node scripts/browser-smoke.mjs
      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-server-log
          path: /tmp/project6581-server.log
